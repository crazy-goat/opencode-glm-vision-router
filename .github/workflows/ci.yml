name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bash bin/lint.sh
